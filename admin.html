<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Argos Training — User Admin</title>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
    --primary: #0d9488;
    --primary-hover: #0f766e;
    --danger: #dc2626;
    --success: #16a34a;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  .hidden { display: none !important; }
  .login-screen {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    background: linear-gradient(135deg, #f0fdfa 0%, #f8fafc 100%);
  }
  .login-card, .panel {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(15,23,42,0.08);
  }
  .login-card { max-width: 420px; width: 100%; }
  .login-logo {
    width: 52px; height: 52px;
    background: linear-gradient(135deg, var(--primary), var(--primary-hover));
    border-radius: 12px;
    display: grid; place-items: center;
    color: white; font-size: 22px; margin-bottom: 16px;
  }
  .login-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
  .field { margin-bottom: 16px; }
  .field-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 14px; font-family: inherit; background: white;
  }
  input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(13,148,136,0.12); }
  .btn {
    padding: 10px 18px; border-radius: 6px; font-size: 14px; font-weight: 600;
    border: none; cursor: pointer;
  }
  .btn-primary { background: var(--primary); color: white; width: 100%; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
  .btn-secondary { background: white; color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: white; color: var(--danger); border: 1px solid #fecaca; }
  .btn-danger:hover { background: #fef2f2; }
  .btn-outline { background: white; color: var(--primary); border: 1px solid var(--primary); }
  .btn-outline:hover { background: #f0fdfa; }
  .btn-outline:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 6px; }
  .app-header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
    color: white; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .app-header h1 { font-size: 18px; font-weight: 700; }
  .app-header p { font-size: 12px; opacity: 0.9; }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .panel { margin-bottom: 20px; }
  .panel-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto auto;
    gap: 12px;
    align-items: end;
  }
  .checkbox-field {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; white-space: nowrap; padding-bottom: 10px;
  }
  .users-table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left; padding: 12px 10px;
    border-bottom: 1px solid var(--border); vertical-align: middle;
  }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
  .toggle {
    position: relative; width: 42px; height: 24px; display: inline-block;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; inset: 0; background: #cbd5e1; border-radius: 999px; cursor: pointer;
    transition: background 0.2s;
  }
  .toggle-slider:before {
    content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
    background: white; border-radius: 50%; transition: transform 0.2s;
  }
  .toggle input:checked + .toggle-slider { background: var(--primary); }
  .toggle input:checked + .toggle-slider:before { transform: translateX(18px); }
  .empty-state { color: var(--text-muted); padding: 24px 0; text-align: center; }
  .toast {
    position: fixed; bottom: 24px; right: 24px; padding: 12px 18px;
    background: #0f172a; color: white; border-radius: 8px; font-size: 13px;
    opacity: 0; transform: translateY(8px); transition: all 0.2s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .spinner-sm {
    width: 14px; height: 14px; border: 2px solid #cbd5e1; border-top-color: var(--primary);
    border-radius: 50%; display: inline-block; animation: spin 0.75s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @media (max-width: 800px) {
    .form-row { grid-template-columns: 1fr; }
    .checkbox-field { padding-bottom: 0; }
  }
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">A</div>
    <div class="login-title">User Admin</div>
    <div class="login-sub">Manage trainee access for Argos practice and assessment.</div>
    <div class="field">
      <label class="field-label" for="adminEmail">Admin email</label>
      <input type="email" id="adminEmail" placeholder="admin@example.com" autocomplete="username" />
    </div>
    <div class="field">
      <label class="field-label" for="adminPassword">Password</label>
      <input type="password" id="adminPassword" placeholder="Password" autocomplete="current-password" />
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="adminLogin()">Sign in</button>
  </div>
</div>

<div id="dashboard" class="hidden">
  <header class="app-header">
    <div>
      <h1>Argos User Admin</h1>
      <p>Manage who can log in to practice and assessment</p>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <a href="reports.html" class="btn btn-secondary btn-sm" style="text-decoration:none;">View Reports →</a>
      <button class="btn btn-secondary btn-sm" onclick="adminLogout()">Log out</button>
    </div>
  </header>

  <div class="container">
    <div class="panel">
      <div class="panel-title">Add user</div>
      <div class="form-row">
        <div class="field" style="margin:0">
          <label class="field-label" for="newEmail">Email</label>
          <input type="email" id="newEmail" placeholder="trainee@example.com" />
        </div>
        <div class="field" style="margin:0">
          <label class="field-label" for="newName">Name</label>
          <input type="text" id="newName" placeholder="Full name" />
        </div>
        <label class="checkbox-field">
          <input type="checkbox" id="newEnabled" checked />
          Enabled
        </label>
        <button class="btn btn-primary" id="addUserBtn" style="width:auto" onclick="addUser()">Add user</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Registered users</div>
      <div class="users-table-wrap">
        <table>
          <thead>
            <tr>
              <th>Email</th>
              <th>Name</th>
              <th>Login enabled</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="4" class="empty-state"><span class="spinner-sm"></span> Loading users...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const SHEETS_ENDPOINT = "https://script.google.com/macros/s/AKfycbyhTGSGtU52syftzSIkPvsKvOTiYO9VeUNSUg7LLDNOH6_4Le8T5X419Ayb8oSiLDli/exec";
const ADMIN_TOKEN_KEY = "argos_admin_token";
const ADMIN_TOKEN_EXP_KEY = "argos_admin_token_exp";

let users = [];

function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show " + (type || "");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => { t.className = "toast"; }, 2600);
}

function getAdminToken() {
  const token = sessionStorage.getItem(ADMIN_TOKEN_KEY);
  const exp = Number(sessionStorage.getItem(ADMIN_TOKEN_EXP_KEY) || 0);
  if (!token || !exp || Date.now() > exp) {
    clearAdminSession();
    return null;
  }
  return token;
}

function setAdminSession(token, expiresInSec) {
  sessionStorage.setItem(ADMIN_TOKEN_KEY, token);
  sessionStorage.setItem(ADMIN_TOKEN_EXP_KEY, String(Date.now() + (expiresInSec * 1000)));
}

function clearAdminSession() {
  sessionStorage.removeItem(ADMIN_TOKEN_KEY);
  sessionStorage.removeItem(ADMIN_TOKEN_EXP_KEY);
}

async function apiPost(payload) {
  if (!SHEETS_ENDPOINT || SHEETS_ENDPOINT.includes("PASTE_YOUR")) {
    throw new Error("Sheets endpoint is not configured.");
  }
  const res = await fetch(SHEETS_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  if (!res.ok) {
    throw new Error("Request failed.");
  }
  const data = await res.json();
  if (!data || data.ok !== true) {
    throw new Error((data && data.message) || "Request failed.");
  }
  return data;
}

async function apiGetUsers(token) {
  const url = SHEETS_ENDPOINT + "?action=admin_users&token=" + encodeURIComponent(token);
  const res = await fetch(url, { method: "GET" });
  if (!res.ok) {
    throw new Error("Could not load users.");
  }
  const data = await res.json();
  if (!data || data.ok !== true) {
    throw new Error((data && data.message) || "Could not load users.");
  }
  return data.users || [];
}

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderUsers() {
  const tbody = document.getElementById("usersTableBody");
  if (!users.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No users found.</td></tr>';
    return;
  }

  tbody.innerHTML = users.map((user, index) => `
    <tr>
      <td>${escapeHtml(user.email)}</td>
      <td>${escapeHtml(user.name)}</td>
      <td>
        <label class="toggle" title="Toggle login access">
          <input type="checkbox" data-index="${index}" ${user.enabled ? "checked" : ""}
            onchange="toggleUserByIndex(this)" />
          <span class="toggle-slider"></span>
        </label>
      </td>
      <td>
        <div style="display:flex; gap:8px; align-items:center;">
          <a href="reports.html?email=${encodeURIComponent(user.email)}" class="btn btn-outline btn-sm" style="text-decoration:none;">View Report</a>
          <button class="btn btn-danger btn-sm" data-index="${index}" onclick="removeUserByIndex(this)">Remove</button>
        </div>
      </td>
    </tr>
  `).join("");
}

async function loadUsers() {
  const token = getAdminToken();
  if (!token) {
    showLogin();
    return;
  }

  const tbody = document.getElementById("usersTableBody");
  if (tbody) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-state"><span class="spinner-sm"></span> Loading users...</td></tr>';
  }

  try {
    users = await apiGetUsers(token);
    users.sort((a, b) => {
      const nameA = String(a.name || a.email || "").trim().toLowerCase();
      const nameB = String(b.name || b.email || "").trim().toLowerCase();
      return nameA.localeCompare(nameB);
    });
    renderUsers();
  } catch (err) {
    console.error(err);
    if (String(err.message || "").toLowerCase().includes("unauthorized")) {
      clearAdminSession();
      showLogin();
      showToast("Session expired. Please sign in again.", "error");
      return;
    }
    showToast(err.message || "Could not load users.", "error");
  }
}

function showLogin() {
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("dashboard").classList.add("hidden");
}

function showDashboard() {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
}

async function adminLogin() {
  const email = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("adminPassword").value;
  const btn = document.getElementById("loginBtn");

  if (!email || !email.includes("@")) {
    showToast("Please enter a valid admin email.", "error");
    return;
  }
  if (!password) {
    showToast("Please enter your password.", "error");
    return;
  }

  btn.disabled = true;
  const defaultLabel = btn.dataset.defaultLabel || btn.textContent;
  btn.dataset.defaultLabel = defaultLabel;
  btn.textContent = "Signing in...";
  try {
    const data = await apiPost({
      action: "admin_login",
      email,
      password
    });
    setAdminSession(data.token, data.expiresIn || 7200);
    document.getElementById("adminPassword").value = "";
    showDashboard();
    await loadUsers();
    showToast("Signed in successfully.", "success");
  } catch (err) {
    console.error(err);
    showToast(err.message || "Sign in failed.", "error");
  } finally {
    btn.disabled = false;
    btn.textContent = defaultLabel;
  }
}

function adminLogout() {
  clearAdminSession();
  users = [];
  showLogin();
  showToast("Logged out.", "success");
}

async function addUser() {
  const token = getAdminToken();
  if (!token) {
    showLogin();
    return;
  }

  const email = document.getElementById("newEmail").value.trim();
  const name = document.getElementById("newName").value.trim();
  const enabled = document.getElementById("newEnabled").checked;
  const btn = document.getElementById("addUserBtn");

  if (!email || !email.includes("@")) {
    showToast("Please enter a valid email.", "error");
    return;
  }
  if (!name) {
    showToast("Name is required.", "error");
    return;
  }

  btn.disabled = true;
  try {
    await apiPost({
      action: "admin_add_user",
      token,
      email,
      name,
      enabled
    });
    document.getElementById("newEmail").value = "";
    document.getElementById("newName").value = "";
    document.getElementById("newEnabled").checked = true;
    await loadUsers();
    showToast("User added.", "success");
  } catch (err) {
    console.error(err);
    showToast(err.message || "Could not add user.", "error");
  } finally {
    btn.disabled = false;
  }
}

async function removeUserByIndex(btn) {
  const index = Number(btn.getAttribute("data-index"));
  const user = users[index];
  if (!user) return;
  await removeUser(user.email);
}

async function toggleUserByIndex(checkbox) {
  const index = Number(checkbox.getAttribute("data-index"));
  const user = users[index];
  if (!user) return;
  await toggleUser(user.email, checkbox);
}

async function removeUser(email) {
  const token = getAdminToken();
  if (!token) {
    showLogin();
    return;
  }

  if (!confirm("Remove " + email + "? This cannot be undone.")) {
    return;
  }

  try {
    await apiPost({
      action: "admin_remove_user",
      token,
      email
    });
    await loadUsers();
    showToast("User removed.", "success");
  } catch (err) {
    console.error(err);
    showToast(err.message || "Could not remove user.", "error");
  }
}

async function toggleUser(email, checkbox) {
  const token = getAdminToken();
  if (!token) {
    showLogin();
    return;
  }

  const enabled = checkbox.checked;
  try {
    await apiPost({
      action: "admin_toggle_user",
      token,
      email,
      enabled
    });
    const user = users.find((u) => u.email === email);
    if (user) user.enabled = enabled;
    showToast(enabled ? "Login enabled." : "Login disabled.", "success");
  } catch (err) {
    console.error(err);
    checkbox.checked = !enabled;
    showToast(err.message || "Could not update user.", "error");
  }
}

(async function init() {
  if (getAdminToken()) {
    showDashboard();
    await loadUsers();
  } else {
    showLogin();
    document.getElementById("adminEmail").focus();
  }
})();

document.getElementById("adminPassword").addEventListener("keydown", (e) => {
  if (e.key === "Enter") adminLogin();
});
</script>
</body>
</html>
